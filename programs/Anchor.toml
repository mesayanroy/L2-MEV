[toolchain]
anchor_version = "0.30.0"
solana_version = "1.18.12"

[features]
resolution = true
skip-lint = false

[programs.localnet]
mev_shield = "MevShd1111111111111111111111111111111111111"

[programs.devnet]
mev_shield = "MevShd1111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[workspace]
members = ["mev-shield"]
