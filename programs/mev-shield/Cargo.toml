[package]
name = "mev-shield"
version = "0.1.0"
edition = "2021"
description = "On-chain MEV slippage guard and price commitment program"

[lib]
crate-type = ["cdylib", "lib"]
name = "mev_shield"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []

[dependencies]
anchor-lang = "0.30.0"
anchor-spl = "0.30.0"

[dev-dependencies]
anchor-lang = { version = "0.30.0", features = ["derive"] }
